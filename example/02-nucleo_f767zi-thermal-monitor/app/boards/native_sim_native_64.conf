# SIL target: console + shell on the process stdin/stdout, so an agent can drive the app with
#   embsk uart --exec build-sim/zephyr/zephyr.exe --script app/sil/thermal.sil
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Logging like on the board: only the shell's UART backend, deferred mode.
# native_sim defaults to immediate mode, where lines logged before the shell starts (the boot line)
# never reach the shell backend, and to an extra stdout backend that prints every line twice.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
