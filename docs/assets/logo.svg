<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">embedded-sys logo: a microcontroller whose die carries a rising path of graph nodes (the evidence ladder), ending in a verified amber node</title>
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- pins: 4 per side -->
  <g fill="#94a3b8">
    <rect x="76" y="20" width="14" height="36" rx="4"/><rect x="104" y="20" width="14" height="36" rx="4"/>
    <rect x="138" y="20" width="14" height="36" rx="4"/><rect x="166" y="20" width="14" height="36" rx="4"/>
    <rect x="76" y="200" width="14" height="36" rx="4"/><rect x="104" y="200" width="14" height="36" rx="4"/>
    <rect x="138" y="200" width="14" height="36" rx="4"/><rect x="166" y="200" width="14" height="36" rx="4"/>
    <rect x="20" y="76" width="36" height="14" rx="4"/><rect x="20" y="104" width="36" height="14" rx="4"/>
    <rect x="20" y="138" width="36" height="14" rx="4"/><rect x="20" y="166" width="36" height="14" rx="4"/>
    <rect x="200" y="76" width="36" height="14" rx="4"/><rect x="200" y="104" width="36" height="14" rx="4"/>
    <rect x="200" y="138" width="36" height="14" rx="4"/><rect x="200" y="166" width="36" height="14" rx="4"/>
  </g>
  <!-- package -->
  <rect x="44" y="44" width="168" height="168" rx="26" fill="url(#die)"/>
  <rect x="56" y="56" width="144" height="144" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="74" cy="74" r="6" fill="#ffffff" fill-opacity="0.55"/>
  <!-- evidence ladder as a graph: L1 build, L2 host tests, L3 analysis, L4 on target -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="82,170 112,146 144,154 174,96"/>
    <line x1="112" y1="146" x2="118" y2="104" stroke-opacity="0.55" stroke-width="5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="82" cy="170" r="11"/>
    <circle cx="112" cy="146" r="11"/>
    <circle cx="144" cy="154" r="11"/>
    <circle cx="118" cy="104" r="8" fill-opacity="0.75"/>
  </g>
  <circle cx="174" cy="96" r="15" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>
</svg>
