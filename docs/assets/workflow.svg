<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t">
  <title id="t">embedded-sys workflow: profile, spec, plan, test-first build, verify on the evidence ladder L1 to L5, fresh-context review, document; with loops back to build, tiers, and the tools used across phases</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    .t { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .h { font-size: 19px; font-weight: 700; fill: #f0f6fc; }
    .s { font-size: 13px; fill: #9da7b3; }
    .num { font-size: 15px; font-weight: 700; fill: #0d1117; }
    .lab { font-size: 13px; fill: #c9d1d9; }
    .sec { font-size: 14px; font-weight: 700; fill: #8b949e; letter-spacing: 1.5px; }
  </style>

  <rect width="1280" height="660" rx="24" fill="#0d1117"/>

  <!-- ===================== phases ===================== -->
  <text class="t sec" x="40" y="44">PHASES · EACH ONE ENDS AT A GATE</text>
  <g class="t">
    <!-- 1 Profile -->
    <rect class="box" x="40" y="62" width="150" height="104" rx="14"/>
    <circle cx="64" cy="86" r="13" fill="#2dd4bf"/><text class="num" x="64" y="91" text-anchor="middle">1</text>
    <text class="h" x="84" y="92">Profile</text>
    <text class="s" x="54" y="124">Alt+A · /embsk</text>
    <text class="s" x="54" y="144">board · probe · logs</text>
    <!-- 2 Spec -->
    <rect class="box" x="218" y="62" width="150" height="104" rx="14"/>
    <circle cx="242" cy="86" r="13" fill="#2dd4bf"/><text class="num" x="242" y="91" text-anchor="middle">2</text>
    <text class="h" x="262" y="92">Spec</text>
    <text class="s" x="232" y="124">≤ 5 questions</text>
    <text class="s" x="232" y="144">REQ-n · budgets</text>
    <!-- 3 Plan -->
    <rect class="box" x="396" y="62" width="150" height="104" rx="14"/>
    <circle cx="420" cy="86" r="13" fill="#2dd4bf"/><text class="num" x="420" y="91" text-anchor="middle">3</text>
    <text class="h" x="440" y="92">Plan</text>
    <text class="s" x="410" y="124">vertical slices</text>
    <text class="s" x="410" y="144">parallel lanes</text>
    <!-- 4 Build -->
    <rect class="box" x="574" y="62" width="150" height="104" rx="14"/>
    <circle cx="598" cy="86" r="13" fill="#818cf8"/><text class="num" x="598" y="91" text-anchor="middle">4</text>
    <text class="h" x="618" y="92">Build</text>
    <text class="s" x="588" y="124">failing test first</text>
    <text class="s" x="588" y="144">smallest change</text>
    <!-- 5 Verify (highlighted) -->
    <rect x="752" y="62" width="150" height="104" rx="14" fill="#1c1a12" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="776" cy="86" r="13" fill="#f59e0b"/><text class="num" x="776" y="91" text-anchor="middle">5</text>
    <text class="h" x="796" y="92">Verify</text>
    <text class="s" x="766" y="124">evidence L1 → L5</text>
    <text class="s m" x="766" y="144">embsk uart</text>
    <!-- 6 Review -->
    <rect class="box" x="930" y="62" width="150" height="104" rx="14"/>
    <circle cx="954" cy="86" r="13" fill="#818cf8"/><text class="num" x="954" y="91" text-anchor="middle">6</text>
    <text class="h" x="974" y="92">Review</text>
    <text class="s" x="944" y="124">fresh context</text>
    <text class="s" x="944" y="144">fw-reviewer</text>
    <!-- 7 Document -->
    <rect class="box" x="1108" y="62" width="150" height="104" rx="14"/>
    <circle cx="1132" cy="86" r="13" fill="#2dd4bf"/><text class="num" x="1132" y="91" text-anchor="middle">7</text>
    <text class="h" x="1152" y="92">Document</text>
    <text class="s" x="1122" y="124">graphify · ADRs</text>
    <text class="s" x="1122" y="144">traceability</text>
  </g>
  <!-- forward arrows -->
  <g stroke="#8b949e" stroke-width="2" marker-end="url(#arr)">
    <line x1="192" y1="114" x2="214" y2="114"/>
    <line x1="370" y1="114" x2="392" y2="114"/>
    <line x1="548" y1="114" x2="570" y2="114"/>
    <line x1="726" y1="114" x2="748" y2="114"/>
    <line x1="904" y1="114" x2="926" y2="114"/>
    <line x1="1082" y1="114" x2="1104" y2="114"/>
  </g>
  <!-- gates -->
  <g class="t" font-size="12" fill="#2dd4bf" text-anchor="middle">
    <text x="293" y="186">you approve</text>
    <text x="471" y="186">1 task = 1 commit</text>
    <text x="649" y="186">verify cmd green</text>
    <text x="827" y="186">level + proof</text>
    <text x="1005" y="186">Verdict: Ship</text>
    <text x="1183" y="186">docs = code</text>
  </g>
  <!-- loops back to Build -->
  <g fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrRed)">
    <path d="M820 196 C 820 244, 604 244, 600 194"/>
    <path d="M1005 60 C 1005 24, 649 24, 649 58"/>
  </g>
  <g class="t" font-size="12" fill="#f87171" text-anchor="middle">
    <text x="712" y="258">fail → UART loop → fix</text>
    <text x="827" y="22">must fix</text>
  </g>

  <!-- ===================== tiers + ladder ===================== -->
  <text class="t sec" x="40" y="300">CEREMONY SCALES WITH STAKES</text>
  <g class="t">
    <rect class="box" x="40" y="316" width="560" height="150" rx="14"/>
    <rect x="58" y="336" width="54" height="26" rx="6" fill="#30363d"/><text class="t" x="85" y="354" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">T0</text>
    <text class="lab" x="126" y="354">a Kconfig line, a typo · build → verify (L1)</text>
    <rect x="58" y="376" width="54" height="26" rx="6" fill="#30363d"/><text class="t" x="85" y="394" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">T1</text>
    <text class="lab" x="126" y="394">driver, feature, bug fix · spec-lite → plan → build → verify → review</text>
    <rect x="58" y="416" width="54" height="26" rx="6" fill="#7c2d12"/><text class="t" x="85" y="434" font-size="14" font-weight="700" fill="#fed7aa" text-anchor="middle">T2</text>
    <text class="lab" x="126" y="434">bootloader, OTA, security, safety · all phases + safety audit</text>
  </g>

  <text class="t sec" x="640" y="300">EVIDENCE LADDER · NEVER "DONE" WITHOUT OUTPUT</text>
  <g class="t">
    <rect x="640" y="426" width="116" height="40" rx="8" fill="#1f2937"/>
    <text class="lab" x="698" y="451" text-anchor="middle">L1 build</text>
    <rect x="764" y="402" width="116" height="64" rx="8" fill="#1f2937"/>
    <text class="lab" x="822" y="427" text-anchor="middle">L2 host tests</text>
    <text class="s" x="822" y="447" text-anchor="middle">+ SIL scenario</text>
    <rect x="888" y="378" width="116" height="88" rx="8" fill="#1f2937"/>
    <text class="lab" x="946" y="403" text-anchor="middle">L3 static</text>
    <text class="s" x="946" y="423" text-anchor="middle">analysis</text>
    <rect x="1012" y="354" width="116" height="112" rx="8" fill="#3b2a0a" stroke="#f59e0b" stroke-width="2"/>
    <text class="lab" x="1070" y="379" text-anchor="middle">L4 on target</text>
    <text class="s" x="1070" y="399" text-anchor="middle">log line over</text>
    <text class="s" x="1070" y="417" text-anchor="middle">UART / RTT</text>
    <rect x="1136" y="330" width="122" height="136" rx="8" fill="#1f2937"/>
    <text class="lab" x="1197" y="355" text-anchor="middle">L5 HIL</text>
    <text class="s" x="1197" y="375" text-anchor="middle">automated</text>
    <text class="s" x="1197" y="393" text-anchor="middle">on-target tests</text>
  </g>

  <!-- ===================== tools across phases ===================== -->
  <text class="t sec" x="40" y="510">TOOLS ACROSS ALL PHASES</text>
  <g class="t">
    <rect class="box" x="40" y="526" width="290" height="96" rx="14"/>
    <text class="h m" x="58" y="560" font-size="17">embsk</text>
    <text class="s" x="58" y="584">profile · doctor · setup (west allowlist)</text>
    <text class="s" x="58" y="604">verify · uart · export</text>

    <rect class="box" x="343" y="526" width="290" height="96" rx="14"/>
    <text class="h m" x="361" y="560" font-size="17">graphify</text>
    <text class="s" x="361" y="584">code graph, 0 LLM tokens</text>
    <text class="s" x="361" y="604">query · explain · path · affected</text>

    <rect class="box" x="646" y="526" width="290" height="96" rx="14"/>
    <text class="h m" x="664" y="560" font-size="17">subagents</text>
    <text class="s" x="664" y="584">scout · builder · verifier · reviewer · safety</text>
    <text class="s" x="664" y="604">parallel lanes, fresh-context review</text>

    <rect x="949" y="526" width="309" height="96" rx="14" fill="#1a1113" stroke="#f87171" stroke-width="2"/>
    <text class="h m" x="967" y="560" font-size="17">flash guard</text>
    <text class="s" x="967" y="584">a hook, not a model decision: asks before</text>
    <text class="s" x="967" y="604">flash · erase · option bytes · fuses</text>
  </g>
</svg>
