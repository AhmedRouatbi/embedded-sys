# embsk: Alt+A opens the embedded profile menu in a popup over ANY terminal agent
# (Codex, Claude Code, Gemini, Aider, plain shell). Requires tmux >= 3.2 and `embsk` on PATH.
# Load:  echo 'source-file ~/.config/embsk/embsk.tmux.conf' >> ~/.tmux.conf && tmux source ~/.tmux.conf
# Note: -n M-a captures Alt+A in every pane (Pi/Claude get the same menu through the popup).
bind -n M-a display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "embsk menu; printf '\nPress Enter to close'; read -r _"
